# Web 只提供管理员工作区。保留 Gateway 所需的访问控制服务与设置服务。
- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: desktop-product-telemetry
  disabled: true
- id: tool-plugin-manager
  disabled: true
# 实际 QQ 网关只允许在独立 QQ 运行时启动。
- id: im-qqbot
  disabled: true
# 插件查询去掉 npm 12 不接受的 fetch-retries 参数。模型侧插件管理工具保持关闭。
- id: plugin-manager
  config:
    pnpmCommand: /usr/local/bin/pnpm-dsh
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: ask
- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: ask
