[package]
name = "antifieldcomplexx-client"
version = "1.1.1"
description = "AntifieldComplexx Windows 与 Android 客户端"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
keyring = "3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
