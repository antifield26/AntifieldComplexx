[package]
name = "antifieldcomplexx-client"
version = "1.2.3"
description = "AntifieldComplexx Windows 与 Android 客户端"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-client-runtime = { path = "plugins/client-runtime" }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(target_os = "android")'.dependencies]
android-keyring = { version = "0.2", features = ["ndk-context"] }

[features]
# 发行构建必须打开。否则壳把主页指到开发服务器，手机上无法进入主页。
custom-protocol = ["tauri/custom-protocol"]
