name: client-build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      api_origin:
        description: 客户端 API HTTPS 源
        required: true
        type: string
      ai_origin:
        description: AI 工作区 HTTPS 源
        required: true
        type: string
      access_origin:
        description: Cloudflare Access 团队 HTTPS 源
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_ORIGIN: ${{ inputs.api_origin || vars.CLIENT_API_ORIGIN || 'https://app.example.com' }}
  VITE_AI_ORIGIN: ${{ inputs.ai_origin || vars.CLIENT_AI_ORIGIN || 'https://ai.example.com' }}
  VITE_ACCESS_ORIGIN: ${{ inputs.access_origin || vars.CLIENT_ACCESS_ORIGIN || 'https://team.cloudflareaccess.com' }}
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: 固定 Rust 工具链
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - run: npm ci
      - run: npm run check:client
      - name: 准备原生上下文引用的前端产物
        run: npm run build
      - name: 原生边界与流式传输测试
        run: cargo test --manifest-path apps/client/src-tauri/Cargo.toml --lib --locked
      - name: 构建 Windows 安装包
        run: npm run build:client:windows
      - name: 归档 Windows 安装包
        uses: actions/upload-artifact@v7
        with:
          name: client-windows-${{ github.sha }}
          path: apps/client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: 固定 Rust 与 Android SDK
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustup target add aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check:client
      - name: 从版本控制源码生成 Android 工程
        run: npm exec -w @antifieldcomplexx/client -- tauri android init --ci --skip-targets-install
      - name: 构建 arm64 APK
        run: npm run build:client:android
      - name: 归档待本机签名的 APK
        uses: actions/upload-artifact@v7
        with:
          name: client-android-arm64-${{ github.sha }}
          path: apps/client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
